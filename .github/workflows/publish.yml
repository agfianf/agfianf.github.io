name: Deploy MkDocs site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          # RSS plugin falls back to git history for post dates
          fetch-depth: 0

      - name: Install Cairo for social cards
        run: sudo apt-get update && sudo apt-get install -y libcairo2

      - name: Cache social cards
        uses: actions/cache@v6
        with:
          key: mkdocs-material-${{ hashFiles('mkdocs.yml', 'uv.lock') }}
          path: .cache
          restore-keys: mkdocs-material-

      - name: Install uv and set the python version
        # setup-uv publishes only full version tags from v8 on, so there is no moving v10 tag to follow
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Build MkDocs site
        run: uv run mkdocs build --strict

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
