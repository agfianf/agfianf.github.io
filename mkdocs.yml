site_name: agfian's space
site_url: https://agfianf.github.io/
site_author: M Agfian
site_description: Notes on AI engineering, MLOps, DevOps, and whatever I'm learning.
# Same line as the landing page's footer; partials/copyright.html swaps the last year for the year of the build
copyright: "&copy; 2025–2026 M Agfian · Indonesia"
extra:
  generator: false
  social:
    - icon: hugeicons/github-01
      link: https://github.com/agfianf
      name: GitHub
    - icon: hugeicons/linkedin-01
      link: https://www.linkedin.com/in/magfianf/
      name: LinkedIn
    - icon: hugeicons/rss
      link: https://agfianf.github.io/feed_rss_created.xml
      name: RSS feed
theme:
  name: 'material'
  language: en
  # A small square crop of the bolt (3.5 KB); assets/logo.png stays for feeds and social cards
  logo: 'assets/logo-mark.png'
  favicon: 'assets/logo-mark.png'
  custom_dir: overrides
  # Fonts load once, from overrides/main.html (Plus Jakarta Sans, IBM Plex Mono, Instrument Serif italic)
  font: false
  # Dark is the default (first entry); colours come from stylesheets/tokens.css, shared with the landing page
  # The toggle shows the current scheme (moon in dark, sun in light), the same as the landing page's button
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: hugeicons/moon-02
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: hugeicons/sun-03
        name: Switch to dark mode
  # Icons come from Hugeicons (free set, MIT) in overrides/.icons/hugeicons; add more with scripts/hugeicons.py
  icon:
    menu: hugeicons/menu-01
    search: hugeicons/search-01
    share: hugeicons/share-08
    close: hugeicons/cancel-01
    top: hugeicons/arrow-up-02
    previous: hugeicons/arrow-left-02
    next: hugeicons/arrow-right-02
    edit: hugeicons/edit-02
    view: hugeicons/view
    annotation: hugeicons/plus-sign
    admonition:
      note: hugeicons/note-01
      abstract: hugeicons/book-02
      info: hugeicons/information-circle
      tip: hugeicons/megaphone-01
      success: hugeicons/tick-02
      question: hugeicons/help-circle
      warning: hugeicons/alert-02
      failure: hugeicons/bomb
      danger: hugeicons/skull
      bug: hugeicons/robot-01
      example: hugeicons/flask-conical
      quote: hugeicons/expand
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.instant.prefetch
    - navigation.footer
    # The tabs bar itself is not drawn (the header has inline links, see overrides/main.html); the feature keeps the left sidebar scoped to the current section
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.tabs.link


markdown_extensions:
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true
  - abbr
  - footnotes
  - tables
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - def_list
  - md_in_html
  - pymdownx.blocks.caption
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      # Makes :hugeicons-<name>: shortcodes work in posts
      options:
        custom_icons:
          - overrides/.icons

extra_css:
  - stylesheets/tokens.css
  - stylesheets/extra.css
  - stylesheets/blog.css
  - stylesheets/404.css

extra_javascript:
  - javascripts/site.js

# Adds loading="lazy" and decoding="async" to images in page content
hooks:
  - hooks/lazy_images.py

plugins:
  - search
  - tags
  # Blog views use overrides/blog.html and overrides/partials/post.html (cards); posts use overrides/blog-post.html (byline)
  - blog:
      blog_toc: false
      post_date_format: dd MMM yyyy
      post_excerpt: optional
      post_excerpt_max_categories: 2
      post_readtime: true
      post_readtime_words_per_minute: 265
      archive: true
      archive_date_format: yyyy
      categories: true
      authors_file: "{blog}/.authors.yml"
      pagination: true
      pagination_per_page: 12
      pagination_format: "$link_previous ~2~ $link_next"
  - glightbox
  # Social cards need Cairo; enabled in CI (GitHub Actions sets CI=true) to keep local serve fast
  - social:
      enabled: !ENV [CI, false]
      # Dark landing-style cards: layouts/agfian.yml with its assets in layouts/agfian/
      cards_layout_dir: layouts
      cards_layout: agfian
  - rss:
      match_path: blog/posts/.*
      image: https://agfianf.github.io/assets/logo.png
      date_from_meta:
        as_creation: date.created
        as_update: date.updated
      # Every published post's category is also one of its tags, so tags alone avoid duplicate <category> entries
      categories:
        - tags



nav:
  - Home: index.html
  - Blog:
    - blog/index.md
  - Tags: tags.md
  - Github: https://github.com/agfianf
  - About: about.md
