site_name: agfian's space
site_url: https://agfianf.github.io/
site_author: M Agfian
site_description: Notes on AI engineering, MLOps, DevOps, and whatever I'm learning.
copyright: Copyright &copy; 2025 M Agfian
extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/agfianf
      name: GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/magfianf/
      name: LinkedIn
    - icon: fontawesome/solid/rss
      link: https://agfianf.github.io/feed_rss_created.xml
      name: RSS feed
theme:
  name: 'material'
  language: en
  logo: 'assets/logo.png'
  favicon: 'assets/logo.png'
  custom_dir: overrides
  font:
    text: 'Plus Jakarta Sans'
    code: 'IBM Plex Mono'
  # Dark is the default (first entry); colours come from stylesheets/tokens.css, shared with the landing page
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  icon:
    admonition:
      note: fontawesome/solid/note-sticky
      abstract: fontawesome/solid/book
      info: fontawesome/solid/circle-info
      tip: fontawesome/solid/bullhorn
      success: fontawesome/solid/check
      question: fontawesome/solid/circle-question
      warning: fontawesome/solid/triangle-exclamation
      failure: fontawesome/solid/bomb
      danger: fontawesome/solid/skull
      bug: fontawesome/solid/robot
      example: fontawesome/solid/flask
      # quote: octicons/quote-16
      quote: fontawesome/solid/expand
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.instant.prefetch
    - navigation.footer
    - navigation.tabs
    # - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.tabs.link


markdown_extensions:
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true
  - abbr
  - footnotes
  - tables
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - def_list
  - md_in_html
  - pymdownx.blocks.caption
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/tokens.css
  - stylesheets/extra.css
  - stylesheets/blog.css
  - stylesheets/404.css

plugins:
  - search
  - tags
  # Blog views use overrides/blog.html and overrides/partials/post.html (cards); posts use overrides/blog-post.html (byline)
  - blog:
      blog_toc: false
      post_date_format: dd MMM yyyy
      post_excerpt: optional
      post_excerpt_max_categories: 2
      post_readtime: true
      post_readtime_words_per_minute: 265
      archive: true
      archive_date_format: yyyy
      categories: true
      authors_file: "{blog}/.authors.yml"
      pagination: true
      pagination_per_page: 12
      pagination_format: "$link_previous ~2~ $link_next"
  - glightbox
  # Social cards need Cairo; enabled in CI (GitHub Actions sets CI=true) to keep local serve fast
  - social:
      enabled: !ENV [CI, false]
      # Dark landing-style cards: layouts/agfian.yml with its assets in layouts/agfian/
      cards_layout_dir: layouts
      cards_layout: agfian
  - rss:
      match_path: blog/posts/.*
      date_from_meta:
        as_creation: date.created
        as_update: date.updated
      categories:
        - categories
        - tags



nav:
  - Home: index.html
  - Blog:
    - blog/index.md
  - Tags: tags.md
  - Github: https://github.com/agfianf
  - About: about.md
